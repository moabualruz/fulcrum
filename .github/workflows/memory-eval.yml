name: Memory Eval

on:
  schedule:
    - cron: '0 2 * * *'  # nightly at 02:00 UTC
  pull_request:
    paths:
      - 'specs/001-rag-lifecycle-hardening/**'
      - 'packages/memory/package.json'
      - 'packages/memory/src/**'
      - 'packages/core/src/db/**'
      - 'packages/core/src/types.ts'
      - 'packages/core/src/ids.ts'
      - 'packages/cli/src/commands/memory-rag-*.ts'
      - 'packages/cli/src/tool-registry.ts'
      - 'packages/cli/src/mcp-tools.ts'
      - '.github/workflows/memory-eval.yml'

jobs:
  rag-lifecycle-eval:
    name: RAG Lifecycle Eval (default gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fulcrum-memory eval:rag-lifecycle

  fulcrum-recall-eval:
    name: Fulcrum Recall Eval (primary)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fulcrum-memory eval:fulcrum-recall

  longmemeval-harness:
    name: LongMemEval Harness (secondary conversational-memory benchmark)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter fulcrum-memory eval:longmemeval
