<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Fulcrum Monitor</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --bg: #0d1117; --surface: #161b22; --border: #30363d;
      --text: #c9d1d9; --muted: #6e7681; --accent: #58a6ff;
      --green: #3fb950; --yellow: #d29922; --red: #f85149;
      --purple: #a371f7; --font: 'SF Mono', 'Fira Code', monospace;
    }
    body { background: var(--bg); color: var(--text); font-family: var(--font); font-size: 13px; height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--surface); border-bottom: 1px solid var(--border); padding: 10px 16px; display: flex; align-items: center; gap: 16px; flex-shrink: 0; }
    header h1 { font-size: 14px; font-weight: 600; color: var(--accent); }
    #ws-id { font-size: 11px; color: var(--muted); }
    #connection-status { margin-left: auto; font-size: 11px; }
    #connection-status.connected { color: var(--green); }
    #connection-status.disconnected { color: var(--red); }
    main { display: grid; grid-template-columns: 1.2fr 0.8fr; grid-template-rows: auto 1fr 1fr; gap: 1px; flex: 1; overflow: hidden; background: var(--border); }
    .panel { background: var(--bg); overflow: hidden; display: flex; flex-direction: column; }
    .panel-header { background: var(--surface); padding: 8px 12px; font-size: 11px; font-weight: 600; color: var(--muted); letter-spacing: 0.5px; text-transform: uppercase; display: flex; align-items: center; gap: 8px; flex-shrink: 0; border-bottom: 1px solid var(--border); }
    .panel-header .count { background: var(--border); border-radius: 10px; padding: 1px 6px; font-size: 10px; }
    .panel-body { overflow-y: auto; flex: 1; padding: 8px; }
    /* Board */
    #board { grid-column: 1 / -1; }
    .board-cols { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
    .board-col { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px; min-height: 80px; }
    .board-col-title { font-size: 10px; font-weight: 600; letter-spacing: 0.5px; text-transform: uppercase; margin-bottom: 6px; }
    .board-col-title.backlog { color: var(--muted); }
    .board-col-title.active { color: var(--accent); }
    .board-col-title.blocked { color: var(--red); }
    .board-col-title.done { color: var(--green); }
    .board-count { font-size: 24px; font-weight: 700; }
    .task-card { background: var(--bg); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; margin-bottom: 4px; font-size: 11px; cursor: pointer; }
    .task-card:hover { border-color: var(--accent); }
    .task-card .task-title { color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .task-card .task-meta { color: var(--muted); font-size: 10px; margin-top: 2px; }
    /* Agents */
    .agent-row { display: flex; align-items: center; gap: 8px; padding: 5px 4px; border-bottom: 1px solid var(--border); font-size: 11px; }
    .agent-row:last-child { border-bottom: none; }
    .status-dot { width: 7px; height: 7px; border-radius: 50%; flex-shrink: 0; }
    .status-dot.running { background: var(--green); }
    .status-dot.blocked { background: var(--red); }
    .status-dot.waiting { background: var(--yellow); }
    .status-dot.finished, .status-dot.done { background: var(--muted); }
    .status-dot.failed, .status-dot.aborted { background: var(--red); opacity: 0.5; }
    .agent-role { color: var(--accent); width: 120px; flex-shrink: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agent-task { flex: 1; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .agent-age { color: var(--muted); font-size: 10px; flex-shrink: 0; }
    .btn { background: var(--surface); border: 1px solid var(--border); color: var(--text); padding: 3px 8px; border-radius: 4px; cursor: pointer; font-size: 11px; font-family: var(--font); }
    .btn:hover { border-color: var(--accent); color: var(--accent); }
    .btn.danger:hover { border-color: var(--red); color: var(--red); }
    .btn.success:hover { border-color: var(--green); color: var(--green); }
    /* Events */
    #event-list { font-size: 11px; }
    .event-line { padding: 2px 4px; border-radius: 3px; display: flex; gap: 8px; align-items: baseline; white-space: nowrap; overflow: hidden; }
    .event-line:hover { background: var(--surface); }
    .event-ts { color: var(--muted); flex-shrink: 0; font-size: 10px; }
    .event-role { color: var(--accent); flex-shrink: 0; width: 100px; overflow: hidden; text-overflow: ellipsis; }
    .event-body { color: var(--text); overflow: hidden; text-overflow: ellipsis; }
    .event-line.blocked .event-body { color: var(--red); }
    .event-line.policy .event-body { color: var(--yellow); }
    /* Quick actions */
    .action-row { display: flex; align-items: center; gap: 8px; padding: 6px 4px; border-bottom: 1px solid var(--border); }
    .action-row:last-child { border-bottom: none; }
    .action-label { flex: 1; font-size: 11px; }
    .action-label strong { color: var(--accent); display: block; }
    .action-label span { color: var(--muted); font-size: 10px; }
    /* PM dashboard */
    .pm-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 8px; margin-bottom: 8px; }
    .pm-card { background: var(--surface); border: 1px solid var(--border); border-radius: 6px; padding: 8px; }
    .pm-card strong { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 0.4px; color: var(--muted); margin-bottom: 6px; }
    .pm-metric { font-size: 22px; font-weight: 700; }
    .pm-sub { color: var(--muted); font-size: 10px; margin-top: 4px; }
    .pm-list { display: flex; flex-direction: column; gap: 6px; }
    .pm-row { background: var(--surface); border: 1px solid var(--border); border-radius: 4px; padding: 6px 8px; }
    .pm-row b { color: var(--accent); }
    .pm-row small { color: var(--muted); display: block; margin-top: 2px; }
    /* Create task form */
    #create-task-form { display: none; padding: 8px; background: var(--surface); border-top: 1px solid var(--border); }
    #create-task-form.visible { display: block; }
    #create-task-form input { width: 100%; background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 5px 8px; border-radius: 4px; font-family: var(--font); font-size: 12px; margin-bottom: 6px; }
    #create-task-form input:focus { outline: none; border-color: var(--accent); }
    #create-task-form .form-actions { display: flex; gap: 6px; }
    .token-bar { background: var(--surface); border-top: 1px solid var(--border); padding: 6px 12px; display: flex; align-items: center; gap: 8px; font-size: 11px; flex-shrink: 0; }
    .token-bar label { color: var(--muted); }
    .token-bar input { background: var(--bg); border: 1px solid var(--border); color: var(--text); padding: 3px 6px; border-radius: 4px; font-family: var(--font); font-size: 11px; width: 200px; }
  </style>
</head>
<body>
  <header>
    <h1>⬡ Fulcrum Monitor</h1>
    <span id="ws-id"></span>
    <span id="last-event-ts" style="font-size:11px;color:var(--muted)"></span>
    <span id="connection-status" class="disconnected">● disconnected</span>
  </header>

  <main>
    <!-- Board summary row -->
    <div class="panel" id="board">
      <div class="panel-header">Board</div>
      <div class="panel-body">
        <div class="board-cols">
          <div class="board-col">
            <div class="board-col-title backlog">Backlog</div>
            <div class="board-count" id="cnt-backlog">—</div>
          </div>
          <div class="board-col">
            <div class="board-col-title active">Active</div>
            <div class="board-count" id="cnt-active">—</div>
          </div>
          <div class="board-col">
            <div class="board-col-title blocked">Blocked</div>
            <div class="board-count" id="cnt-blocked">—</div>
          </div>
          <div class="board-col">
            <div class="board-col-title done">Done</div>
            <div class="board-count" id="cnt-done">—</div>
          </div>
        </div>
      </div>
    </div>

    <!-- Active agents -->
    <div class="panel">
      <div class="panel-header">Active Agents <span class="count" id="agent-count">0</span></div>
      <div class="panel-body" id="agents-list"></div>
    </div>

    <!-- Event log -->
    <div class="panel">
      <div class="panel-header">Event Stream</div>
      <div class="panel-body" id="event-list"></div>
    </div>

    <!-- Quick actions / blocked runs -->
    <div class="panel">
      <div class="panel-header">Blocked Runs <span class="count" id="blocked-count">0</span></div>
      <div class="panel-body" id="blocked-list"></div>
      <div id="create-task-form">
        <input type="text" id="new-task-title" placeholder="Task title…">
        <div class="form-actions">
          <button class="btn success" onclick="submitCreateTask()">Create</button>
          <button class="btn" onclick="hideCreateForm()">Cancel</button>
        </div>
      </div>
    </div>

    <div class="panel">
      <div class="panel-header">PM Dashboard</div>
      <div class="panel-body">
        <div class="pm-grid">
          <div class="pm-card">
            <strong>Active Delivery</strong>
            <div class="pm-metric" id="pm-active-work">0</div>
            <div class="pm-sub" id="pm-blocked-pct">0% blocked</div>
          </div>
          <div class="pm-card">
            <strong>Open Reviews</strong>
            <div class="pm-metric" id="pm-open-reviews">0</div>
            <div class="pm-sub" id="pm-plans-active">0 active plans</div>
          </div>
          <div class="pm-card">
            <strong>Issues</strong>
            <div class="pm-metric" id="pm-issues-blocked">0</div>
            <div class="pm-sub" id="pm-issues-meta">0 in review</div>
          </div>
          <div class="pm-card">
            <strong>Epics</strong>
            <div class="pm-metric" id="pm-epics-active">0</div>
            <div class="pm-sub" id="pm-epics-meta">0 total</div>
          </div>
        </div>
        <div class="pm-list" id="pm-focus-list"></div>
      </div>
    </div>
  </main>

  <div class="token-bar">
    <label>Auth token:</label>
    <input type="password" id="token-input" placeholder="(leave blank for dev mode)"
           value="" oninput="saveToken(this.value)">
    <button class="btn success" onclick="showCreateForm()" style="margin-left:auto">+ New Task</button>
  </div>

  <script>
    // ── State ──────────────────────────────────────────────────────────────────
    const BASE = window.location.origin
    let wsId = null
    let eventSource = null
    const MAX_EVENTS = 200

    // ── Token management ───────────────────────────────────────────────────────
    const tokenInput = document.getElementById('token-input')
    const saved = localStorage.getItem('fulcrum_monitor_token') || ''
    tokenInput.value = saved

    function saveToken(v) {
      localStorage.setItem('fulcrum_monitor_token', v)
    }

    function authHeaders() {
      const tok = localStorage.getItem('fulcrum_monitor_token') || ''
      return tok ? { 'Authorization': `Bearer ${tok}`, 'Content-Type': 'application/json' }
                 : { 'Content-Type': 'application/json' }
    }

    // ── Utilities ──────────────────────────────────────────────────────────────
    function fmtTs(isoStr) {
      const d = new Date(isoStr)
      const hh = String(d.getHours()).padStart(2,'0')
      const mm = String(d.getMinutes()).padStart(2,'0')
      const ss = String(d.getSeconds()).padStart(2,'0')
      return `${hh}:${mm}:${ss}`
    }

    function fmtAge(startedAt) {
      const sec = Math.floor((Date.now() - new Date(startedAt).getTime()) / 1000)
      if (sec < 60) return `${sec}s`
      if (sec < 3600) return `${Math.floor(sec/60)}m`
      return `${Math.floor(sec/3600)}h`
    }

    function esc(s) {
      return String(s||'').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;')
    }

    // ── Board ──────────────────────────────────────────────────────────────────
    async function refreshBoard() {
      const qs = wsId ? `?workspace_id=${wsId}` : ''
      try {
        const r = await fetch(`${BASE}/board${qs}`)
        if (!r.ok) return
        const j = await r.json()
        const d = j.data || {}
        document.getElementById('cnt-backlog').textContent = d.backlog ?? 0
        document.getElementById('cnt-active').textContent = d.active ?? 0
        document.getElementById('cnt-blocked').textContent = d.blocked ?? 0
        document.getElementById('cnt-done').textContent = d.done ?? 0
      } catch {}
    }

    // ── Agents ─────────────────────────────────────────────────────────────────
    async function refreshAgents() {
      const qs = wsId ? `?workspace_id=${wsId}` : ''
      try {
        const r = await fetch(`${BASE}/agents${qs}`)
        if (!r.ok) return
        const j = await r.json()
        const runs = (j.data || []).filter(r => ['running','waiting','starting'].includes(r.status))
        document.getElementById('agent-count').textContent = runs.length

        const el = document.getElementById('agents-list')
        el.innerHTML = runs.length === 0 ? '<div style="color:var(--muted);padding:8px">No active agents</div>' :
          runs.map(run => `
            <div class="agent-row">
              <div class="status-dot ${esc(run.status)}"></div>
              <div class="agent-role">${esc(run.role)}</div>
              <div class="agent-task">${esc(run.task_id||'')}</div>
              <div class="agent-age">${fmtAge(run.started_at)}</div>
              <button class="btn danger" onclick="killRun('${esc(run.run_id)}')">kill</button>
            </div>
          `).join('')
      } catch {}
    }

    // ── Blocked runs ───────────────────────────────────────────────────────────
    async function refreshBlocked() {
      const qs = wsId ? `?workspace_id=${wsId}` : ''
      try {
        const r = await fetch(`${BASE}/agents${qs}`)
        if (!r.ok) return
        const j = await r.json()
        const blocked = (j.data || []).filter(r => r.status === 'blocked')
        document.getElementById('blocked-count').textContent = blocked.length

        const el = document.getElementById('blocked-list')
        el.innerHTML = blocked.length === 0
          ? '<div style="color:var(--muted);padding:8px">No blocked runs</div>'
          : blocked.map(run => `
            <div class="action-row">
              <div class="action-label">
                <strong>${esc(run.role)}</strong>
                <span>${esc(run.blocker || run.run_id)}</span>
              </div>
              <button class="btn success" onclick="unblockRun('${esc(run.run_id)}')">unblock</button>
              <button class="btn danger" onclick="killRun('${esc(run.run_id)}')">kill</button>
            </div>
          `).join('')
      } catch {}
    }

    // ── PM dashboard ──────────────────────────────────────────────────────────
    async function refreshPmOverview() {
      const qs = wsId ? `?workspace_id=${wsId}` : ''
      try {
        const r = await fetch(`${BASE}/pm/overview${qs}`)
        if (!r.ok) return
        const j = await r.json()
        const d = j.data || {}
        const health = d.delivery_health || {}
        const issues = d.issues || {}
        const epics = d.epics || {}
        const plans = d.plans || {}
        const focus = d.focus || {}

        document.getElementById('pm-active-work').textContent = health.active_work ?? 0
        document.getElementById('pm-blocked-pct').textContent = `${health.blocked_pct ?? 0}% blocked`
        document.getElementById('pm-open-reviews').textContent = health.open_reviews ?? 0
        document.getElementById('pm-plans-active').textContent = `${plans.active ?? 0} active plans`
        document.getElementById('pm-issues-blocked').textContent = issues.blocked ?? 0
        document.getElementById('pm-issues-meta').textContent = `${issues.in_review ?? 0} in review`
        document.getElementById('pm-epics-active').textContent = epics.active ?? 0
        document.getElementById('pm-epics-meta').textContent = `${epics.total ?? 0} total`

        const blockedIssues = focus.blocked_issues || []
        const activePlans = focus.active_plans || []
        const pendingReviews = focus.pending_reviews || []
        const rows = []

        blockedIssues.slice(0, 2).forEach(issue => {
          rows.push(`<div class="pm-row"><b>Blocked issue</b> ${esc(issue.title || issue.issue_id || '')}<small>${esc(issue.display_id || '')}</small></div>`)
        })
        activePlans.slice(0, 2).forEach(plan => {
          rows.push(`<div class="pm-row"><b>Active plan</b> ${esc(plan.title || plan.plan_id || '')}<small>${esc(plan.file_path || '')}</small></div>`)
        })
        pendingReviews.slice(0, 2).forEach(review => {
          rows.push(`<div class="pm-row"><b>Pending review</b> ${esc(review.review_id || '')}<small>${esc(review.target_type || '')} → ${esc(review.target_id || '')}</small></div>`)
        })

        document.getElementById('pm-focus-list').innerHTML = rows.length > 0
          ? rows.join('')
          : '<div style="color:var(--muted);padding:4px 0">No active PM hotspots</div>'
      } catch {}
    }

    // ── Actions ────────────────────────────────────────────────────────────────
    async function unblockRun(runId) {
      try {
        const r = await fetch(`${BASE}/runs/${runId}/unblock`, { method: 'POST', headers: authHeaders(), body: '{}' })
        if (r.ok) { refreshAgents(); refreshBlocked() }
        else { const j = await r.json(); alert(`Error: ${j.error}`) }
      } catch(e) { alert(`Error: ${e.message}`) }
    }

    async function killRun(runId) {
      if (!confirm(`Kill run ${runId}?`)) return
      try {
        const r = await fetch(`${BASE}/runs/${runId}/kill`, { method: 'POST', headers: authHeaders(), body: JSON.stringify({ reason: 'Operator kill' }) })
        if (r.ok) { refreshAgents(); refreshBlocked() }
        else { const j = await r.json(); alert(`Error: ${j.error}`) }
      } catch(e) { alert(`Error: ${e.message}`) }
    }

    function showCreateForm() {
      document.getElementById('create-task-form').classList.add('visible')
      document.getElementById('new-task-title').focus()
    }

    function hideCreateForm() {
      document.getElementById('create-task-form').classList.remove('visible')
      document.getElementById('new-task-title').value = ''
    }

    async function submitCreateTask() {
      const title = document.getElementById('new-task-title').value.trim()
      if (!title) return
      try {
        const body = { title }
        if (wsId) body.workspace_id = wsId
        const r = await fetch(`${BASE}/tasks`, { method: 'POST', headers: authHeaders(), body: JSON.stringify(body) })
        if (r.ok) { hideCreateForm(); refreshBoard() }
        else { const j = await r.json(); alert(`Error: ${j.error}`) }
      } catch(e) { alert(`Error: ${e.message}`) }
    }

    // ── Event log ──────────────────────────────────────────────────────────────
    function formatEventLine(evt) {
      const payload = evt.payload || {}
      const role = payload.role || payload.agent_role || 'system'
      let verb = (evt.evt_type||'').replace(/_/g,' ')
      let detail = ''

      switch(evt.evt_type) {
        case 'agent_run_started': verb = 'started'; detail = payload.run_id||''; break
        case 'agent_run_blocked': verb = 'BLOCKED'; detail = payload.reason||payload.run_id||''; break
        case 'agent_run_finished': verb = 'finished'; detail = payload.run_id||''; break
        case 'agent_run_failed': verb = 'failed'; detail = payload.error||payload.run_id||''; break
        case 'task_created': verb = 'created task'; detail = payload.title||payload.task_id||''; break
        case 'policy_denied': verb = 'POLICY DENIED'; detail = `${payload.tool_name||''}: ${payload.reason||''}`; break
      }

      const cls = evt.evt_type === 'agent_run_blocked' ? 'blocked'
                : evt.evt_type === 'policy_denied' ? 'policy' : ''
      const ts = fmtTs(evt.created_at || evt.ts || new Date().toISOString())
      return `<div class="event-line ${cls}">
        <span class="event-ts">[${ts}]</span>
        <span class="event-role">${esc(role)}</span>
        <span class="event-body">${esc(verb)} ${esc(detail)}</span>
      </div>`
    }

    function appendEvent(evt) {
      const el = document.getElementById('event-list')
      el.insertAdjacentHTML('afterbegin', formatEventLine(evt))
      // Trim to MAX_EVENTS
      while (el.children.length > MAX_EVENTS) el.lastChild.remove()
      document.getElementById('last-event-ts').textContent = fmtTs(evt.created_at || evt.ts || new Date().toISOString())
    }

    // ── SSE connection ─────────────────────────────────────────────────────────
    function connectSSE() {
      if (eventSource) { eventSource.close() }
      const url = `${BASE}/events/stream${wsId ? '?workspace_id=' + wsId : ''}`
      eventSource = new EventSource(url)

      eventSource.onopen = () => {
        const el = document.getElementById('connection-status')
        el.textContent = '● connected'
        el.className = 'connected'
      }

      eventSource.onmessage = (e) => {
        try {
          const evt = JSON.parse(e.data)
          appendEvent(evt)
          // Refresh panels when relevant events arrive
          if (evt.evt_type && (evt.evt_type.startsWith('agent_run') || evt.evt_type.startsWith('task'))) {
            refreshBoard()
            refreshAgents()
            refreshBlocked()
            refreshPmOverview()
          }
        } catch {}
      }

      eventSource.onerror = () => {
        const el = document.getElementById('connection-status')
        el.textContent = '● disconnected'
        el.className = 'disconnected'
        // Auto-reconnect after 3s
        setTimeout(connectSSE, 3000)
      }
    }

    // ── Init ───────────────────────────────────────────────────────────────────
    async function init() {
      try {
        const r = await fetch(`${BASE}/status`)
        if (r.ok) {
          const j = await r.json()
          wsId = j.workspace_id || null
          document.getElementById('ws-id').textContent = wsId ? `ws: ${wsId}` : ''
        }
      } catch {}

      await Promise.all([ refreshBoard(), refreshAgents(), refreshBlocked(), refreshPmOverview() ])
      connectSSE()

      // Refresh panels every 10s (for when SSE misses events)
      setInterval(() => { refreshBoard(); refreshAgents(); refreshBlocked(); refreshPmOverview() }, 10000)
    }

    // Enter key in create task input
    document.getElementById('new-task-title').addEventListener('keydown', e => {
      if (e.key === 'Enter') submitCreateTask()
      if (e.key === 'Escape') hideCreateForm()
    })

    init()
  </script>
</body>
</html>
