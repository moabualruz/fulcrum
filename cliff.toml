# cliff.toml — git-cliff configuration for Fulcrum
# Docs: https://git-cliff.org/docs/configuration

[changelog]
# Pinned header
header = """
# Changelog

All notable changes to Fulcrum will be tracked here.
"""
# Template for the changelog body
# https://keats.github.io/tera/docs/#introduction
body = """
{% if version %}\
    ## [{{ version | trim_start_matches(pat="v") }}] - {{ timestamp | date(format="%Y-%m-%d") }}
{% else %}\
    ## [unreleased]
{% endif %}\
{% for group, commits in commits | group_by(attribute="group") %}
    ### {{ group | upper_first }}
    {% for commit in commits %}
        - {% if commit.breaking %}[**breaking**] {% endif %}\
          {% if commit.scope %}*({{ commit.scope }})* {% endif %}\
          {{ commit.message | upper_first }}\
          {% if commit.id %} ([{{ commit.id | truncate(length=7, end="") }}]({{ remote.url | default(value="https://github.com/anthropics/fulcrum") }}/commit/{{ commit.id }})){% endif %}
    {% endfor %}
{% endfor %}\n
"""
footer = """
<!-- generated by git-cliff -->
"""
trim = true

[git]
# Parse commits according to conventional commits
conventional_commits = true
# Filter out commits that are not conventional
filter_unconventional = false
# Process each line of a commit as an individual commit
split_commits = false
# Regex preprocessors applied before parsing
commit_preprocessors = []
# Regex parsers for grouping commits
commit_parsers = [
    { message = "^feat", group = "Features" },
    { message = "^fix", group = "Bug Fixes" },
    { message = "^refactor", group = "Refactor" },
    { message = "^doc", group = "Documentation" },
    { message = "^docs", group = "Documentation" },
    { message = "^perf", group = "Performance" },
    { message = "^test", group = "Tests" },
    { message = "^build", group = "Build/CI" },
    { message = "^ci", group = "Build/CI" },
    { message = "^style", group = "Styling" },
    # Skip release commits so they don't appear in their own CHANGELOG entry
    { message = "^chore\\(release\\):", skip = true },
    # Skip merge commits
    { message = "^Merge ", skip = true },
    { message = "^chore", group = "Chores" },
    { message = ".*", group = "Other" },
]
# Filter out commits matched by parsers with skip = true
filter_commits = false
# Glob pattern for matching git tags
tag_pattern = "v[0-9]*"
# Regex to skip tags
skip_tags = ""
# Regex to ignore tags
ignore_tags = ""
# Sort the tags topologically
topo_order = false
# Sort commits inside sections by oldest/newest
sort_commits = "oldest"
# Detect breaking changes from `!:` syntax and `BREAKING CHANGE:` footer
protect_breaking_commits = false

[remote.github]
owner = "moabualruz"
repo = "fulcrum"
