[package]
name = "fulcrum"
version = "0.1.0"
edition = "2021"
description = "Fulcrum desktop app — Tauri v2 wrapper (gated: FULCRUM_FEATURES=desktop-app)"
authors = ["Fulcrum Team"]
license = "MIT"

# See https://tauri.app/v2/guide/
[lib]
name = "fulcrum_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "fulcrum"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["updater"] }
tauri-plugin-updater = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["full"] }

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
