<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
  <title>Fulcrum — lever pivot</title>
  <!-- Lever beam tilted to show mechanical advantage -->
  <line x1="4" y1="11" x2="28" y2="17" />
  <!-- Pivot triangle (the fulcrum) -->
  <path d="M9 25 L23 25 L16 14 Z" fill="currentColor" stroke="none" />
  <!-- Ground baseline -->
  <line x1="6" y1="27" x2="26" y2="27" />
  <!-- Pivot contact dot on the beam -->
  <circle cx="16" cy="14" r="1.5" fill="currentColor" stroke="none" />
</svg>
