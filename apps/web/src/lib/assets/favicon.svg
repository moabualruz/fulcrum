<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" aria-hidden="true">
  <title>Fulcrum</title>
  <!-- Beam: tilted lever showing mechanical advantage -->
  <line x1="4" y1="11" x2="28" y2="17" stroke="#1e3a8a" stroke-width="2.5" stroke-linecap="round" />
  <!-- Pivot triangle (the fulcrum itself) -->
  <path d="M9 25 L23 25 L16 14 Z" fill="#2563eb" />
  <!-- Ground baseline -->
  <line x1="6" y1="27" x2="26" y2="27" stroke="#1e3a8a" stroke-width="1.5" stroke-linecap="round" />
  <!-- Pivot contact dot at the apex -->
  <circle cx="16" cy="14" r="1.6" fill="#1e3a8a" />
</svg>
