# Fulcrum integration for OpenAI Codex CLI
# Merged into ~/.codex/config.toml by `fulcrum install --codex`

[mcp_servers.fulcrum]
command = "fulcrum"
args = ["serve", "mcp", "--mode", "filtered"]

# v2b PR 17 Task 8.2: invoke_team approval_mode = "prompt" — Codex's native
# confirmation UI fires before invoke_team executes. Hook-based denial is a
# fallback for older Codex builds that do not support per-tool approval_mode.
[tool_approval.invoke_team]
approval_mode = "prompt"

# ── Lifecycle hooks ───────────────────────────────────────────────────────────
# SessionStart: auto-registers an agent run and injects workspace context
# before the first LLM turn. Returns additional_context so Codex sees the
# workspace snapshot without the agent needing to call anything manually.
[[hooks]]
event = "SessionStart"
command = "fulcrum hook codex session-start"

# PreToolUse: secret scan, team-invoke policy guard, and task memory recall.
# Returns {"decision":"approve"} (allow) or {"decision":"block","reason":"..."}
# v2a Task 47: matcher narrowed to the mutating tool allowlist so Read/Glob/
# Grep never shell out to `fulcrum hook codex`.
[[hooks]]
event = "PreToolUse"
command = "fulcrum hook codex"
allowed_tools = ["Write", "Edit", "MultiEdit", "NotebookEdit", "Bash", "Task"]

# PostToolUse: write a typed file_patch / bash_trace memory for the run.
# v2a Task 29 + 47: emits kind='file_patch' or kind='bash_trace' instead of
# the v1 tool_trace catch-all; matcher narrowed.
[[hooks]]
event = "PostToolUse"
command = "fulcrum hook codex post"
allowed_tools = ["Write", "Edit", "MultiEdit", "NotebookEdit", "Bash", "Task"]

# Stop: auto-complete the agent run when the session ends.
[[hooks]]
event = "Stop"
command = "fulcrum hook codex session-end"

# v2a Task 48: notify migration for run-end (stable Codex hook surface
# compared to [[hooks]] Stop which is still feature-flagged on some builds).
[notify]
command = "fulcrum hook codex notify"
