# Fulcrum integration for OpenAI Codex CLI
# Merged into ~/.codex/config.toml by `fulcrum install --codex`
#
# PR 7 unit 7.25-7.26 correction (2026-04-20):
#   - Hook bindings MOVED to agent-integration/codex/hooks.json. Per
#     codex-rs/hooks/src/engine/discovery.rs, Codex reads hooks from
#     `hooks.json` in each config-layer folder; config.toml has NO [hooks]
#     key. The prior [[hooks]] blocks here were dead code.
#   - The [notify] TABLE form was WRONG per codex-rs/config/src/config_toml.rs:
#     `pub notify: Option<Vec<String>>` — `notify` is a root-level flat
#     string array, not a table with `command = "..."`.
#   - `[tool_approval.invoke_team]` is NOT a recognized TOML key in
#     config_toml.rs. Removed.

# Notify on run-end (stable across Codex builds). Flat string array form.
# Must live above any section header — TOML binds subsequent top-level keys
# to the most recently opened section.
notify = ["fulcrum", "hook", "codex", "notify"]

[mcp_servers.fulcrum]
command = "fulcrum"
args = ["serve", "mcp", "--mode", "filtered"]
