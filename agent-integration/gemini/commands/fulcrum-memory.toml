prompt = """
Search Fulcrum project memory for: {{args}}

Results:
```
!{fulcrum action exec recall_memory --json "{\"query\":\"{{args}}\",\"limit\":10}" 2>/dev/null}
```

Present memories with score > 0.7 as highly relevant. Include content, score, and tags.
If no results are found, say so and suggest a broader search term.

To save a new memory after completing significant work:
```bash
fulcrum action exec write_memory --json '{"content":"...","title":"...","tags":["tag1","tag2"]}'
```
"""
