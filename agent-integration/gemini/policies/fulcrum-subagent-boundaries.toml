# Fulcrum subagent-boundary policies for Gemini CLI
#
# Enforce role boundaries via the policy engine instead of prompt text. Per
# docs/core/subagents.md §"Enforce Subagent-Specific Policies", a rule with
# `subagent = "<name>"` scopes the check to calls originating from that
# subagent. This is the canonical way to prevent chief_of_staff from writing
# to project files — prose in GEMINI.md is advisory; a policy rule is
# enforced.
#
# All decisions here are `deny` (which IS honored at extension tier, unlike
# `allow`). See docs/extensions/reference.md §"Policy Engine Rules".

# Chief of Staff must not write code or edit files. The L1 orchestrator
# delegates all writes to L2 specialists (software_engineer,
# integration_worker, refactor_worker, etc.).
[[rule]]
subagent = "chief_of_staff"
toolName = [
  "write_file",
  "replace",
]
decision = "deny"
priority = 600
denyMessage = "chief_of_staff cannot write files directly. Delegate to a software_engineer / integration_worker / refactor_worker subagent."

# Shell execution from the chief_of_staff breaks the L1/L2 separation too.
[[rule]]
subagent = "chief_of_staff"
toolName = "run_shell_command"
decision = "deny"
priority = 600
denyMessage = "chief_of_staff cannot execute shell commands. Delegate to a worker subagent."

# Team invocation is L1-only — OTHER subagents (L2 workers) must not spawn
# teams. invoke_team stays ask_user globally (see fulcrum-sensitive.toml);
# this rule denies outright when the caller is a non-orchestrator subagent.
[[rule]]
subagent = "software_engineer"
toolName = "mcp_fulcrum_invoke_team"
decision = "deny"
priority = 600
denyMessage = "Only chief_of_staff may invoke teams. Escalate to chief_of_staff."

[[rule]]
subagent = "integration_worker"
toolName = "mcp_fulcrum_invoke_team"
decision = "deny"
priority = 600
denyMessage = "Only chief_of_staff may invoke teams. Escalate to chief_of_staff."

[[rule]]
subagent = "refactor_worker"
toolName = "mcp_fulcrum_invoke_team"
decision = "deny"
priority = 600
denyMessage = "Only chief_of_staff may invoke teams. Escalate to chief_of_staff."
