[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "pi-agent-os"
version = "0.1.0"
description = "PI Local-First Agent Operating System — control plane, memory, workflows, monitor, policy"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }

dependencies = [
    # Core data models
    "pydantic>=2.7",
    "python-ulid>=2.2",
    # Async SQLite
    "aiosqlite>=0.20",
    # CLI
    "typer>=0.12",
    "rich>=13.7",
    # Web monitor (SSE + read-only API)
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "sse-starlette>=2.1",
    # HTTP client (Plane adapter + web tools)
    "httpx>=0.27",
    # Vector search
    "qdrant-client>=1.9",
    # Embeddings
    "sentence-transformers>=3.0",
    # Code parsing
    "tree-sitter>=0.23",
    "tree-sitter-languages>=1.10",
    # YAML parsing (workflow files)
    "pyyaml>=6.0",
    # File watching (live ingestion)
    "watchdog>=4.0",
    # Crypto (content hashing)
    "blake3>=0.3",
    # Date/time
    "python-dateutil>=2.9",
    # MCP tool server
    "mcp>=1.0",
    # OpenTelemetry observability
    "opentelemetry-api>=1.25",
    "opentelemetry-sdk>=1.25",
    "opentelemetry-semantic-conventions>=0.46b0",
]

[project.optional-dependencies]
graphiti = [
    "graphiti-core>=0.3",
    "neo4j>=5.20",
]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "pytest-cov>=5.0",
    "ruff>=0.4",
    "mypy>=1.10",
    "types-pyyaml>=6.0",
    "types-python-dateutil>=2.9",
    "respx>=0.21",  # httpx mocking
]

[project.scripts]
pi = "pi_agent_os.cli.main:app"
pi-os = "pi_agent_os.cli.main:app"

[tool.hatch.build.targets.wheel]
packages = ["src/pi_agent_os"]

[tool.ruff]
src = ["src"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.12"
strict = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["src"]
