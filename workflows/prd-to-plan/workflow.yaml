name: prd-to-plan
version: "1.0"
description: "Transform a PRD artifact into a plan with tasks and issues."
inputs:
  - name: prd_id
    required: true
  - name: workspace_id
    required: true
  - name: project_id
    required: true

steps:
  - id: read_prd
    name: "Read PRD artifact"
    type: read_project
    inputs:
      artifact_id: "{{prd_id}}"

  - id: draft_plan
    name: "Draft plan with user"
    type: prompt_user
    depends_on: [read_prd]
    inputs:
      prompt: |
        Based on the PRD, let me draft an implementation plan.

        Please confirm:
        1. Phases / milestones
        2. Key technical decisions
        3. Dependencies between phases
        4. Risk areas needing investigation
        5. Rough size/complexity per phase (S/M/L)

  - id: write_plan_artifact
    name: "Write plan artifact"
    type: write_artifact
    depends_on: [draft_plan]
    inputs:
      artifact_type: plan
      title: "Plan for PRD {{prd_id}}"
      content: |
        # Implementation Plan

        **PRD:** {{prd_id}}
        **Date:** {{ts}}

        ## Phases

        ## Dependencies

        ## Risks

        ---
        *Generated by prd-to-plan workflow*
    artifact_declarations:
      - type: plan

  - id: create_epic
    name: "Create epic for this plan"
    type: create_issue
    depends_on: [write_plan_artifact]
    inputs:
      workspace_id: "{{workspace_id}}"
      project_id: "{{project_id}}"
      title: "Epic: {{prd_id}}"
      description: "Top-level epic generated from PRD"
      item_type: "epic"

  - id: complete
    name: "Complete"
    type: complete
    depends_on: [create_epic]
