name: write-a-prd
version: "1.0"
description: "Template-backed PRD creation workflow. May call context gathering first."
inputs:
  - name: title
    required: true
  - name: workspace_id
    required: true
  - name: project_id
    required: true
  - name: grill_me_artifact_id
    required: false

steps:
  - id: check_context
    name: "Check if grill-me was run"
    type: read_memory
    inputs:
      query: "{{title}}"
      scope: "project"
      kind: "task_goal"

  - id: gather_context
    name: "Read project context"
    type: read_project
    depends_on: [check_context]
    inputs:
      project_id: "{{project_id}}"

  - id: draft_prd
    name: "Draft PRD with user"
    type: prompt_user
    depends_on: [gather_context]
    inputs:
      prompt: |
        I'll help you draft a PRD for: {{title}}

        Based on context gathered, please confirm or refine:
        1. Problem statement
        2. Goals and success metrics
        3. User stories / use cases (top 3-5)
        4. Functional requirements (must-have)
        5. Non-functional requirements
        6. Out of scope
        7. Risks and open questions

  - id: write_prd_artifact
    name: "Write PRD artifact"
    type: write_artifact
    depends_on: [draft_prd]
    inputs:
      artifact_type: prd
      title: "PRD: {{title}}"
      content: |
        # Product Requirements Document

        **Title:** {{title}}
        **Date:** {{ts}}
        **Status:** Draft

        ## Problem Statement

        ## Goals

        ## User Stories

        ## Functional Requirements

        ## Non-Functional Requirements

        ## Out of Scope

        ## Risks

        ---
        *Generated by write-a-prd workflow*
    artifact_declarations:
      - type: prd

  - id: complete
    name: "Complete"
    type: complete
    depends_on: [write_prd_artifact]
