name: prd-to-issues
version: "1.0"
description: "Decompose a PRD/plan into issues and tasks."
inputs:
  - name: prd_id
    required: true
  - name: plan_id
    required: false
  - name: workspace_id
    required: true
  - name: project_id
    required: true

steps:
  - id: read_plan
    name: "Read plan"
    type: read_project
    inputs:
      artifact_id: "{{plan_id}}"

  - id: decompose
    name: "Decompose into issues with user"
    type: prompt_user
    depends_on: [read_plan]
    inputs:
      prompt: |
        Let's break this plan into issues. For each issue, provide:
        1. Title (concise)
        2. Description (what needs to be done)
        3. Priority (critical/high/medium/low)
        4. Dependencies on other issues (if any)
        5. Estimated size (S/M/L/XL)

  - id: write_breakdown
    name: "Write issue breakdown artifact"
    type: write_artifact
    depends_on: [decompose]
    inputs:
      artifact_type: issue_breakdown
      title: "Issue Breakdown for {{prd_id}}"
      content: |
        # Issue Breakdown

        **PRD:** {{prd_id}}
        **Date:** {{ts}}

        ## Issues

        {{decompose_output}}

        ---
        *Generated by prd-to-issues workflow*
    artifact_declarations:
      - type: issue_breakdown

  - id: complete
    name: "Complete"
    type: complete
    depends_on: [write_breakdown]
