# ── MCP families ───────────────────────────────────────────────────────
# MCP tool names are namespaced as mcp__<server>__<tool>; route by full name.
[tools.mcp__deepwiki__read_wiki_contents]
profile = "summary_file"

[tools.mcp__deepwiki__ask_question]
tier = "raw"

[tools.mcp__deepwiki__read_wiki_structure]
