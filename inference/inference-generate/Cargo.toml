[package]
name = "inference-generate"
version = "0.1.0"
edition = "2021"

[dependencies]
candle-core = { version = "0.10", default-features = false }
candle-transformers = { version = "0.10", default-features = false }
candle-nn = { version = "0.10", default-features = false }
tokenizers = { version = "0.22", default-features = false, features = ["http"] }
dirs-next = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
