[package]
name = "inference-server"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "inference-server"
path = "src/main.rs"

[dependencies]
inference-core = { path = "../inference-core" }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
libc = "0.2"
rusqlite = { version = "0.32", features = ["bundled"] }
